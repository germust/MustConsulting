# Publica el sitio en GitHub Pages con cada cambio en la rama main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela una que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Devuelve la URL y la subcarpeta del sitio
      # (https://germust.github.io/MustConsulting y /MustConsulting, o el dominio propio si se configura).
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Opcional: endpoint de Formspree u otro servicio (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
